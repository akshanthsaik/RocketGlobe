name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install frontend dependencies
        run: bun install

      - name: Check TypeScript
        run: bun run check

      - name: Format check
        run: bun run format:check

      # Skip actual build for now (requires Rust + Tauri setup)
      # - name: Build
      #   run: bun run build

  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rocketglobe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint with Ruff
        run: |
          cd backend
          ruff check .

      - name: Check imports and formatting
        run: |
          cd backend
          ruff format --check .

      # Skip tests for now (need to write them)
      # - name: Run tests
      #   env:
      #     DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rocketglobe_test
      #   run: |
      #     cd backend
      #     pytest tests/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check commit messages
        run: |
          git log -1 --pretty=%B | head -n 1 | grep -E "^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert):"
        continue-on-error: true
